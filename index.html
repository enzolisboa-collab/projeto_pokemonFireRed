<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke Shopping</title>
    
    <!-- TODO O VISUAL AQUI DENTRO (CSS) -->
    <style>
        :root {
            --cor-principal: #E3350D;
            --cor-secundaria: #313131;
            --cor-fundo: #F2F2F2;
            --cor-fundo-cartao: #FFFFFF;
            --cor-texto: #000000;
        }

        body.tema-charmander { --cor-principal: #F08030; --cor-secundaria: #C03028; --cor-fundo: #FFF3E0; }
        body.tema-squirtle { --cor-principal: #6890F0; --cor-secundaria: #3858A8; --cor-fundo: #E3F2FD; }
        body.tema-bulbasaur { --cor-principal: #78C850; --cor-secundaria: #489030; --cor-fundo: #E8F5E9; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); transition: 0.3s; }
        .texto-escuro { color: #000 !important; }

        .cabecalho-site { background-color: var(--cor-principal); padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; transition: 0.3s; }
        .grupo-topo-cabecalho { display: flex; align-items: center; gap: 30px; }
        .titulo-principal { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .grupo-abas { display: flex; gap: 10px; }
        
        .botao-aba { background: transparent; border: 2px solid white; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .botao-aba:hover, .botao-aba.ativo { background-color: white; color: var(--cor-principal); }

        .seletor-temas { display: flex; gap: 10px; }
        .bolinha-tema { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
        .cor-padrao { background-color: #E3350D; } .cor-charmander { background-color: #F08030; }
        .cor-squirtle { background-color: #6890F0; } .cor-bulbasaur { background-color: #78C850; }

        .conteudo-principal { display: flex; padding: 20px; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .area-produtos { flex: 3; }
        .area-carrinho { flex: 1; min-width: 300px; }
        .titulo-secao { margin-bottom: 20px; font-size: 22px; color: var(--cor-secundaria); }

        .grade-produtos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .cartao-produto { background-color: var(--cor-fundo-cartao); border: 2px solid #ccc; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .cartao-produto:hover { transform: translateY(-5px); border-color: var(--cor-principal); }
        .imagem-produto { width: 100px; height: 100px; background-color: #f0f0f0; border-radius: 8px; margin-bottom: 10px; object-fit: contain; }
        .nome-produto { font-size: 18px; margin-bottom: 15px; color: #000; }
        
        .rodape-cartao { display: flex; justify-content: space-between; align-items: center; }
        .rodape-cartao span { font-weight: bold; font-size: 18px; color: #000; }
        .botao-comprar-item { background-color: var(--cor-principal); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .botao-comprar-item:hover { background-color: var(--cor-secundaria); }

        .caixa-carrinho { background-color: white; padding: 20px; border-radius: 10px; border: 2px solid var(--cor-secundaria); position: sticky; top: 20px; }
        .lista-itens-carrinho { min-height: 100px; max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .info-item .nome-item { font-weight: bold; color: #000;}
        .controles-quantidade { display: flex; align-items: center; gap: 10px; }
        .botao-qtd { background-color: #ddd; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; color: #000; }
        
        .rodape-carrinho { border-top: 2px solid #eee; padding-top: 15px; }
        .linha-total { display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 15px; color: #000; }
        .botao-finalizar { width: 100%; background-color: var(--cor-principal); color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .botao-finalizar:disabled { background-color: #ccc; cursor: not-allowed; }

        .fundo-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; }
        .oculto { display: none !important; }
        .caixa-modal { background: white; padding: 30px; border-radius: 10px; text-align: center; border: 4px solid var(--cor-principal); max-width: 400px; }
        .titulo-modal { color: var(--cor-principal); margin-bottom: 15px; }
        .botao-fechar-modal { margin-top: 20px; background-color: var(--cor-secundaria); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 900px) {
            .conteudo-principal { flex-direction: column; }
            .grade-produtos { grid-template-columns: repeat(2, 1fr); }
            .grupo-topo-cabecalho { flex-direction: column; gap: 10px; }
        }
        @media (max-width: 600px) { .grade-produtos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho-site">
        <div class="grupo-topo-cabecalho">
            <h1 class="titulo-principal">POKE SHOP</h1>
            <nav class="grupo-abas">
                <button id="aba-itens" class="botao-aba ativo" onclick="mudarAba('itens')">Itens</button>
                <button id="aba-tms" class="botao-aba" onclick="mudarAba('tms')">TMs</button>
            </nav>
        </div>
        
        <div class="seletor-temas">
            <div class="bolinha-tema cor-padrao" onclick="mudarTema('padrao')" title="Tema Padrão"></div>
            <div class="bolinha-tema cor-charmander" onclick="mudarTema('tema-charmander')" title="Tema Charmander"></div>
            <div class="bolinha-tema cor-squirtle" onclick="mudarTema('tema-squirtle')" title="Tema Squirtle"></div>
            <div class="bolinha-tema cor-bulbasaur" onclick="mudarTema('tema-bulbasaur')" title="Tema Bulbasaur"></div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo-principal">
        
        <!-- PRODUTOS -->
        <section class="area-produtos">
            <h2 id="titulo-produtos" class="titulo-secao">Itens Disponíveis</h2>
            
            <div id="grade-produtos" class="grade-produtos">
                <!-- Preenchido pelo JavaScript -->
            </div>
        </section>

        <!-- CARRINHO -->
        <aside class="area-carrinho">
            <div class="caixa-carrinho">
                <h2 class="titulo-secao texto-escuro">Sua Mochila</h2>
                
                <div id="lista-carrinho" class="lista-itens-carrinho"></div>
                
                <div class="rodape-carrinho">
                    <div class="linha-total">
                        <strong>Total:</strong>
                        <span id="valor-total" class="texto-escuro">$ 0</span>
                    </div>
                    <button id="botao-finalizar" class="botao-finalizar" onclick="finalizarCompra()">
                        Comprar
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- MODAL DE COMPRA -->
    <div id="modal-sucesso" class="fundo-modal oculto">
        <div class="caixa-modal">
            <h2 class="titulo-modal">Obrigado!</h2>
            <p>Sua compra foi realizada com sucesso e os itens foram guardados na sua mochila.</p>
            <button class="botao-fechar-modal" onclick="fecharModal()">Voltar para a Loja</button>
        </div>
    </div>

    <!-- TODA A LÓGICA AQUI DENTRO (JS) -->
    <script>
        const listaItens = [
            { id: 1, nome: "Poké Ball", preco: 200, imagem: "" },
            { id: 2, nome: "Potion", preco: 300, imagem: "" },
            { id: 3, nome: "Antidote", preco: 100, imagem: "" },
            { id: 4, nome: "Great Ball", preco: 600, imagem: "" },
            { id: 5, nome: "Super Potion", preco: 700, imagem: "" },
            { id: 6, nome: "Parlyz Heal", preco: 200, imagem: "" },
            { id: 7, nome: "Awakening", preco: 250, imagem: "" },
            { id: 8, nome: "Burn Heal", preco: 250, imagem: "" },
            { id: 9, nome: "Ice Heal", preco: 250, imagem: "" },
            { id: 10, nome: "Repel", preco: 350, imagem: "" },
            { id: 11, nome: "Escape Rope", preco: 550, imagem: "" },
            { id: 12, nome: "Hyper Potion", preco: 1200, imagem: "" },
            { id: 13, nome: "Super Repel", preco: 500, imagem: "" },
            { id: 14, nome: "Revive", preco: 1500, imagem: "" },
            { id: 15, nome: "Ultra Ball", preco: 1200, imagem: "" },
            { id: 16, nome: "Full Heal", preco: 600, imagem: "" },
            { id: 17, nome: "Max Repel", preco: 700, imagem: "" },
            { id: 18, nome: "Max Potion", preco: 2500, imagem: "" },
            { id: 19, nome: "Full Restore", preco: 3000, imagem: "" }
        ];

        const listaTMs = [
            { id: 101, nome: "TM01 Mega Punch", preco: 3000, imagem: "" },
            { id: 102, nome: "TM02 Razor Wind", preco: 2000, imagem: "" },
            { id: 103, nome: "TM05 Mega Kick", preco: 3000, imagem: "" },
            { id: 104, nome: "TM07 Horn Drill", preco: 2000, imagem: "" },
            { id: 105, nome: "TM09 Take Down", preco: 3000, imagem: "" },
            { id: 106, nome: "TM15 Hyper Beam", preco: 5500, imagem: "" },
            { id: 107, nome: "TM32 Double Team", preco: 1000, imagem: "" },
            { id: 108, nome: "TM33 Reflect", preco: 1000, imagem: "" },
            { id: 109, nome: "TM37 Sludge Bomb", preco: 2000, imagem: "" },
            { id: 110, nome: "TM50 Substitute", preco: 2000, imagem: "" }
        ];

        const catalogoCompleto = [...listaItens, ...listaTMs];
        let carrinho = {}; 

        const elementoGrade = document.getElementById('grade-produtos');
        const elementoTituloProdutos = document.getElementById('titulo-produtos');
        const elementoListaCarrinho = document.getElementById('lista-carrinho');
        const elementoTotal = document.getElementById('valor-total');
        const botaoFinalizar = document.getElementById('botao-finalizar');
        const modalSucesso = document.getElementById('modal-sucesso');

        function renderizarProdutos(listaParaMostrar) {
            elementoGrade.innerHTML = ''; 
            
            listaParaMostrar.forEach(produto => {
                const cartao = document.createElement('article');
                cartao.className = 'cartao-produto';
                
                cartao.innerHTML = `
                    <img src="${produto.imagem}" alt="${produto.nome}" class="imagem-produto">
                    <h3 class="nome-produto">${produto.nome}</h3>
                    <div class="rodape-cartao">
                        <span class="texto-escuro">$ ${produto.preco}</span>
                        <button class="botao-comprar-item" onclick="adicionarAoCarrinho(${produto.id})">Comprar</button>
                    </div>
                `;
                elementoGrade.appendChild(cartao);
            });
        }

        function mudarAba(aba) {
            document.getElementById('aba-itens').classList.remove('ativo');
            document.getElementById('aba-tms').classList.remove('ativo');
            
            if (aba === 'itens') {
                document.getElementById('aba-itens').classList.add('ativo');
                elementoTituloProdutos.innerText = 'Itens Disponíveis';
                renderizarProdutos(listaItens);
            } else {
                document.getElementById('aba-tms').classList.add('ativo');
                elementoTituloProdutos.innerText = 'Máquinas Técnicas (TMs)';
                renderizarProdutos(listaTMs);
            }
        }

        function mudarTema(novoTema) {
            document.body.className = ''; 
            if (novoTema !== 'padrao') document.body.classList.add(novoTema);
        }

        function adicionarAoCarrinho(idProduto) {
            carrinho[idProduto] = (carrinho[idProduto] || 0) + 1;
            atualizarCarrinho();
        }

        function removerDoCarrinho(idProduto) {
            if (carrinho[idProduto]) {
                carrinho[idProduto]--;
                if (carrinho[idProduto] <= 0) delete carrinho[idProduto];
            }
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            elementoListaCarrinho.innerHTML = '';
            let valorTotal = 0;
            const idsNoCarrinho = Object.keys(carrinho);

            if (idsNoCarrinho.length === 0) {
                elementoListaCarrinho.innerHTML = '<p style="color: #000;">Sua mochila está vazia.</p>';
                elementoTotal.innerText = '$ 0';
                botaoFinalizar.disabled = true;
                return;
            }

            botaoFinalizar.disabled = false;

            idsNoCarrinho.forEach(idString => {
                const idInt = parseInt(idString);
                const quantidade = carrinho[idInt];
                const produtoInfo = catalogoCompleto.find(p => p.id === idInt);

                valorTotal += (produtoInfo.preco * quantidade);

                const divItem = document.createElement('div');
                divItem.className = 'item-carrinho';
                divItem.innerHTML = `
                    <div class="info-item">
                        <div class="nome-item">${produtoInfo.nome}</div>
                        <div class="texto-escuro">$ ${produtoInfo.preco}</div>
                    </div>
                    <div class="controles-quantidade">
                        <button class="botao-qtd" onclick="removerDoCarrinho(${idInt})">-</button>
                        <span class="texto-escuro">${quantidade}</span>
                        <button class="botao-qtd" onclick="adicionarAoCarrinho(${idInt})">+</button>
                    </div>
                `;
                elementoListaCarrinho.appendChild(divItem);
            });

            elementoTotal.innerText = `$ ${valorTotal}`;
        }

        function finalizarCompra() {
            modalSucesso.classList.remove('oculto');
            carrinho = {}; 
            atualizarCarrinho();
        }

        function fecharModal() {
            modalSucesso.classList.add('oculto');
        }

        window.onload = () => {
            renderizarProdutos(listaItens);
            atualizarCarrinho();
        };
    </script>
</body>
</html>
