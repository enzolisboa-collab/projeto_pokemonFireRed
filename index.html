<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke Shopping</title>
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="cabecalho-site">
      <div class="grupo-topo-cabecalho">
        <h1 class="titulo-principal">POKE SHOP</h1>
        <nav class="grupo-abas">
          <button
            id="aba-itens"
            class="botao-aba ativo"
            onclick="mudarAba('itens')"
          >
            Itens
          </button>
          <button id="aba-tms" class="botao-aba" onclick="mudarAba('tms')">
            TMs
          </button>
        </nav>
      </div>

      <div class="seletor-temas">
        <div
          class="bolinha-tema cor-padrao"
          onclick="mudarTema('padrao')"
          title="Tema Padrão"
        ></div>
        <div
          class="bolinha-tema cor-charmander"
          onclick="mudarTema('tema-charmander')"
          title="Tema Charmander"
        ></div>
        <div
          class="bolinha-tema cor-squirtle"
          onclick="mudarTema('tema-squirtle')"
          title="Tema Squirtle"
        ></div>
        <div
          class="bolinha-tema cor-bulbasaur"
          onclick="mudarTema('tema-bulbasaur')"
          title="Tema Bulbasaur"
        ></div>
      </div>
    </header>

    <main class="conteudo-principal">
      <section class="area-produtos">
        <h2 id="titulo-produtos" class="titulo-secao">Itens Disponíveis</h2>
        <div id="grade-produtos" class="grade-produtos">
          <!-- Preenchido pelo JavaScript -->
        </div>
      </section>

      <aside class="area-carrinho">
        <div class="caixa-carrinho">
          <h2 class="titulo-secao texto-escuro">Sua Mochila</h2>
          <div id="lista-carrinho" class="lista-itens-carrinho"></div>

          <div class="rodape-carrinho">
            <div class="linha-total">
              <strong>Total:</strong>
              <span id="valor-total" class="texto-escuro">$ 0</span>
            </div>
            <button
              id="botao-finalizar"
              class="botao-finalizar"
              onclick="finalizarCompra()"
            >
              Comprar
            </button>
          </div>
        </div>
      </aside>
    </main>

    <div id="modal-sucesso" class="fundo-modal oculto">
      <div class="caixa-modal">
        <h2 class="titulo-modal">Obrigado!</h2>
        <p>
          Sua compra foi realizada com sucesso e os itens foram guardados na sua
          mochila.
        </p>
        <button class="botao-fechar-modal" onclick="fecharModal()">
          Voltar para a Loja
        </button>
      </div>
    </div>

    <!-- Conectando o arquivo JavaScript -->
    <script src="./js/script.js"></script>
  </body>
</html>
